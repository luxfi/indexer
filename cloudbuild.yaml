steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${_NAMESPACE}/indexer:${_TAG}'
      - '-t'
      - '${_REGISTRY}/${_NAMESPACE}/indexer:${_VERSION}'
      - '.'
images:
  - '${_REGISTRY}/${_NAMESPACE}/indexer:${_TAG}'
  - '${_REGISTRY}/${_NAMESPACE}/indexer:${_VERSION}'
substitutions:
  _REGISTRY: ghcr.io
  _NAMESPACE: luxfi
  _TAG: dev
  _VERSION: latest
options:
  machineType: E2_HIGHCPU_8
timeout: 600s
